spring.application.name=payment-service
server.port=8082
server.forward-headers-strategy=framework

# Database Configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_PAYMENT_DATABASE:mygaadi_payment_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_APP_USER:root}
spring.datasource.password=${MYSQL_APP_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# JWT Security (matching core backend)
jwt.exp.time=7200000
jwt.secret.key=${JWT_SECRET:mygaadi_super_secure_jwt_secret_key_for_development_purposes_only_at_least_64_characters_long_1234567890}

# Service-to-Service Internal API Security
internal.api.key=${INTERNAL_API_KEY:mygaadi_internal_service_secret_api_key_32chars_dev}
backend.service.url=${BACKEND_SERVICE:http://localhost:8081}

# Razorpay Configuration
# Active Razorpay Test Mode with live order creation & checkout popup
razorpay.mock=${RAZORPAY_MOCK:false}
razorpay.key.id=${RAZORPAY_KEY_ID:your_razorpay_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_key_secret}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:your_razorpay_webhook_secret}

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Swagger UI
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
