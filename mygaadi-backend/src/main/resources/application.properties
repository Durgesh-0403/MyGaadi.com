spring.application.name=mygaadi-backend
server.port=8081
server.forward-headers-strategy=framework

# Database Configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mygaadi_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_APP_USER:root}
spring.datasource.password=${MYSQL_APP_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Multipart File Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=45MB

# JWT Configuration (at least 64 chars raw UTF-8 bytes)
jwt.exp.time=7200000
jwt.secret.key=${JWT_SECRET:mygaadi_super_secure_jwt_secret_key_for_development_purposes_only_at_least_64_characters_long_1234567890}

# Service-to-Service Internal API Security
internal.api.key=${INTERNAL_API_KEY:mygaadi_internal_service_secret_api_key_32chars_dev}
payment.service.url=${PAYMENT_SERVICE:http://localhost:8082}

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Local File Storage
app.upload.dir=${UPLOAD_DIR:./uploads}

# Token Booking Business Rules
booking.token.percent=2.0
booking.token.min-amount=5000.00
booking.token.max-amount=50000.00
booking.pending.ttl-minutes=15

# Initial Seeding
admin.email=${ADMIN_EMAIL:admin@mygaadi.com}
admin.password=${ADMIN_PASSWORD:admin@1234}
app.seed-demo-data=${SEED_DEMO_DATA:true}

# Swagger UI
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
